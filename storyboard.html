<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Izu — Four Generations, One Bus</title>
  <style>
    :root {
      --navy:#0b2545;--blue:#1b4f8a;--sky:#2e86de;--teal:#00b4d8;
      --gold:#f4a261;--gray-100:#f3f4f6;--gray-200:#e5e7eb;
      --gray-400:#9ca3af;--gray-700:#374151;--text:#1e293b;
      --card-shadow:0 2px 12px rgba(0,0,0,0.08);--gift-green:#2d6a4f;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--gray-100);color:var(--text);line-height:1.6;}
    header{background:linear-gradient(135deg,#0c1d4d 0%,#1e3a8a 45%,#9a3412 100%);color:white;padding:28px 24px 20px;text-align:center;position:relative;overflow:hidden;}
    header::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");}
    header .badge{display:inline-block;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);border-radius:20px;padding:4px 14px;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px;}
    header h1{font-size:clamp(20px,4.5vw,32px);font-weight:700;letter-spacing:-0.5px;}
    header .sub{font-size:14px;opacity:0.7;margin-top:6px;font-style:italic;}
    .header-meta{display:flex;gap:14px;justify-content:center;margin-top:16px;flex-wrap:wrap;}
    .header-meta span{background:rgba(255,255,255,0.12);border-radius:8px;padding:6px 14px;font-size:13px;}
    nav{background:var(--navy);position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,0.25);}
    .nav-inner{display:flex;overflow-x:auto;scrollbar-width:none;max-width:900px;margin:0 auto;}
    .nav-inner::-webkit-scrollbar{display:none;}
    .nav-btn{flex-shrink:0;padding:12px 16px;background:none;border:none;color:rgba(255,255,255,0.6);font-size:12px;font-weight:500;cursor:pointer;border-bottom:3px solid transparent;transition:all 0.2s;white-space:nowrap;}
    .nav-btn:hover{color:white;}
    .nav-btn.active{color:var(--teal);border-bottom-color:var(--teal);}
    main{max-width:900px;margin:0 auto;padding:24px 16px;}
    .card{background:white;border-radius:14px;padding:22px 24px;box-shadow:var(--card-shadow);margin-bottom:18px;}
    .card h2{font-size:17px;font-weight:700;color:var(--navy);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
    .section-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--teal);margin-bottom:8px;}
    .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
    @media(max-width:640px){.grid-2{grid-template-columns:1fr;}}
    .philosophy-intro{font-size:14px;color:var(--navy);border-left:4px solid var(--gift-green);padding:10px 14px;margin-bottom:20px;background:#f0fdf4;border-radius:0 8px 8px 0;}
    .philosophy-intro cite{display:block;margin-top:6px;font-size:12px;color:var(--gray-400);font-style:normal;}
    .question-framework{background:#f0fdf4;border-radius:12px;padding:16px 18px;margin-bottom:16px;}
    .question-framework h3{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--gift-green);margin-bottom:10px;}
    .q-list{list-style:none;}
    .q-list li{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #d1fae5;font-size:13px;color:var(--gray-700);}
    .q-list li:last-child{border-bottom:none;}
    .q-num{flex-shrink:0;width:22px;height:22px;background:var(--gift-green);color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;margin-top:1px;}
    .principles-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    @media(max-width:640px){.principles-grid{grid-template-columns:1fr;}}
    .principle{background:var(--gray-100);border-radius:10px;padding:12px 14px;}
    .principle .p-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:var(--gift-green);margin-bottom:4px;}
    .principle .p-body{font-size:13px;color:var(--gray-700);}
    .arc-hook{background:linear-gradient(135deg,#1e1b4b,#312e81);color:white;border-radius:12px;padding:16px 18px;margin-bottom:14px;}
    .arc-hook .hook-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;opacity:0.7;margin-bottom:4px;}
    .arc-hook .hook-title{font-size:15px;font-weight:700;margin-bottom:6px;}
    .arc-hook .hook-desc{font-size:13px;opacity:0.85;}
    .acts-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:16px;}
    @media(max-width:640px){.acts-grid{grid-template-columns:1fr;}}
    .act-card{border-radius:12px;padding:16px 18px;}
    .act-card.act-1{background:linear-gradient(135deg,#eef2ff,#f5f3ff);border:1px solid #c7d2fe;}
    .act-card.act-2{background:linear-gradient(135deg,#fff7ed,#fffbeb);border:1px solid #fed7aa;}
    .act-card.act-3{background:linear-gradient(135deg,#f0fdf4,#ecfdf5);border:1px solid #a7f3d0;}
    .act-num{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:4px;}
    .act-1 .act-num{color:#4338ca;}.act-2 .act-num{color:#c2410c;}.act-3 .act-num{color:var(--gift-green);}
    .act-name{font-size:16px;font-weight:700;color:var(--navy);margin-bottom:4px;}
    .act-days{font-size:11px;color:var(--gray-400);margin-bottom:8px;}
    .act-feel{font-size:13px;color:var(--gray-700);font-style:italic;margin-bottom:6px;}
    .act-beat{font-size:12px;color:var(--navy);font-weight:600;}
    .arc-curve-wrap{background:var(--gray-100);border-radius:10px;padding:12px 16px;}
    .arc-curve-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--gray-400);margin-bottom:6px;}
    .away-list{display:flex;flex-direction:column;gap:8px;}
    .away-moment{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;background:#f0fdf4;border-radius:10px;border:1px solid #86efac;}
    .away-icon{font-size:20px;flex-shrink:0;line-height:1;margin-top:1px;}
    .away-title{font-size:13px;font-weight:600;color:var(--gift-green);margin-bottom:3px;}
    .away-why{font-size:12px;color:var(--gray-700);}
    .hero-shot{border:2px solid #f4a261;border-radius:12px;padding:14px 16px;margin-bottom:10px;background:linear-gradient(135deg,#fffbeb,#fff7ed);position:relative;}
    .hero-shot .hero-num{position:absolute;top:-10px;left:14px;background:#f4a261;color:white;font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;border-radius:20px;padding:2px 10px;}
    .hero-shot .hero-title{font-size:14px;font-weight:700;color:var(--navy);margin-bottom:4px;}
    .hero-shot .hero-desc{font-size:13px;color:var(--gray-700);margin-bottom:8px;}
    .hero-shot .hero-why{font-size:12px;color:#92400e;font-style:italic;}
    .day-block{border-radius:14px;margin-bottom:16px;overflow:hidden;box-shadow:var(--card-shadow);}
    .day-block-header{padding:14px 20px;color:white;display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none;}
    .day-block-header .day-label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1.2px;opacity:0.8;}
    .day-block-header .day-name{font-size:16px;font-weight:700;flex:1;}
    .day-block-header .day-date{font-size:12px;opacity:0.75;}
    .day-block-header .chevron{font-size:12px;opacity:0.7;transition:transform 0.2s;}
    .day-block-header.open .chevron{transform:rotate(90deg);}
    .day-block-body{background:white;max-height:0;overflow:hidden;transition:max-height 0.4s ease;}
    .day-block-body.open{max-height:none;padding:16px 20px;}
    .day-filmstrip{display:flex;gap:3px;overflow-x:auto;scrollbar-width:thin;padding:4px 0 12px;margin-bottom:14px;border-bottom:1px solid var(--gray-200);}
    .day-filmstrip::-webkit-scrollbar{height:3px;}
    .day-filmstrip::-webkit-scrollbar-thumb{background:var(--gray-200);border-radius:2px;}
    .filmstrip-cell{flex-shrink:0;width:128px;height:72px;border-radius:3px;position:relative;overflow:hidden;cursor:pointer;border:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,0.08);transition:transform 0.15s,box-shadow 0.15s;}
    .filmstrip-cell:hover{transform:translateY(-2px);box-shadow:0 3px 10px rgba(0,0,0,0.25);z-index:2;}
    .filmstrip-cell svg{position:absolute;top:0;left:0;width:100%;height:100%;}
    .fc-label{position:absolute;bottom:0;left:0;right:0;font-size:8px;text-align:center;color:white;background:rgba(0,0,0,0.5);padding:1px 2px;font-weight:700;text-transform:uppercase;letter-spacing:0.3px;white-space:nowrap;overflow:hidden;font-family:-apple-system,sans-serif;}
    .mindset-note{background:#f0fdf4;border-left:3px solid var(--gift-green);border-radius:0 8px 8px 0;padding:10px 14px;font-size:13px;color:#1a4731;margin-bottom:14px;font-style:italic;}
    .mindset-note strong{display:block;font-size:10px;text-transform:uppercase;letter-spacing:0.8px;color:var(--gift-green);margin-bottom:3px;font-style:normal;font-weight:700;}
    .shot-list{display:flex;flex-direction:column;gap:8px;}
    .shot-row{display:grid;grid-template-columns:240px 1fr;align-items:stretch;border-radius:10px;overflow:hidden;font-size:13px;}
    .shot-row.hero-row{outline:1px solid #fcd34d;}
    .shot-row.no-cam{outline:1px solid #fecaca;}
    .shot-row.present-row{outline:1px solid #86efac;}
    .shot-frame {
      width: 240px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: stretch;
      background: #090d16;
      aspect-ratio: 16 / 9;
      align-self: start;
      border-right: 1.5px solid var(--gray-200);
      user-select: none;
    }
    .shot-frame svg {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0.85;
      transition: opacity 0.3s;
    }
    .shot-row:hover .shot-frame svg {
      opacity: 1;
    }
    /* Viewfinder Overlay */
    .viewfinder-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 6px 8px;
      color: rgba(255, 255, 255, 0.85);
      font-family: -apple-system, SFMono-Regular, Consolas, Monaco, monospace;
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .vf-rec {
      position: absolute;
      top: 5px;
      left: 6px;
      display: flex;
      align-items: center;
      gap: 3px;
      background: rgba(0, 0, 0, 0.6);
      padding: 1px 4px;
      border-radius: 3px;
      font-size: 7.5px;
      color: #fca5a5;
    }
    .vf-rec span {
      width: 4px;
      height: 4px;
      background: #ef4444;
      border-radius: 50%;
      display: inline-block;
      animation: vf-blink 1.2s infinite steps(1);
    }
    @keyframes vf-blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .vf-gear {
      position: absolute;
      top: 5px;
      right: 6px;
      background: rgba(0, 0, 0, 0.6);
      padding: 1px 4px;
      border-radius: 3px;
      font-size: 7.5px;
      color: #93c5fd;
      text-transform: uppercase;
    }
    .vf-tc {
      position: absolute;
      bottom: 5px;
      right: 6px;
      background: rgba(0, 0, 0, 0.6);
      padding: 1px 4px;
      border-radius: 3px;
      font-size: 7.5px;
      color: #cbd5e1;
    }
    .vf-brackets {
      position: absolute;
      inset: 4px;
      border: 1px solid transparent;
      background: 
        linear-gradient(to right, rgba(255,255,255,0.35) 1px, transparent 1px) 0 0,
        linear-gradient(to bottom, rgba(255,255,255,0.35) 1px, transparent 1px) 0 0,
        linear-gradient(to left, rgba(255,255,255,0.35) 1px, transparent 1px) 100% 0,
        linear-gradient(to bottom, rgba(255,255,255,0.35) 1px, transparent 1px) 100% 0,
        linear-gradient(to right, rgba(255,255,255,0.35) 1px, transparent 1px) 0 100%,
        linear-gradient(to top, rgba(255,255,255,0.35) 1px, transparent 1px) 0 100%,
        linear-gradient(to left, rgba(255,255,255,0.35) 1px, transparent 1px) 100% 100%,
        linear-gradient(to top, rgba(255,255,255,0.35) 1px, transparent 1px) 100% 100%;
      background-size: 6px 6px;
      background-repeat: no-repeat;
    }
    .vf-status {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.75);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #cbd5e1;
    }
    .vf-status.status-live {
      color: #a7f3d0;
    }
    .vf-status.status-off {
      color: #fca5a5;
    }
    .shot-body{background:var(--gray-100);padding:9px 12px;display:flex;flex-direction:column;gap:3px;justify-content:center;}
    .shot-row.hero-row .shot-body{background:#fffbeb;}
    .shot-row.no-cam .shot-body{background:#fef2f2;}
    .shot-row.present-row .shot-body{background:#f0fdf4;}
    .shot-type{align-self:flex-start;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;border-radius:6px;padding:2px 8px;margin-bottom:2px;}
    .type-establish{background:#dbeafe;color:#1e40af;}.type-broll{background:#d1fae5;color:#065f46;}
    .type-detail{background:#ede9fe;color:#4c1d95;}.type-movement{background:#ffedd5;color:#c2410c;}
    .type-reaction{background:#fce7f3;color:#9d174d;}.type-hero{background:#fef3c7;color:#92400e;border:1px solid #fbbf24;}
    .type-nocam{background:#fee2e2;color:#991b1b;}.type-audio{background:#f0fdf4;color:#166534;border:1px solid #86efac;}
    .type-present{background:#dcfce7;color:#166534;border:1px solid #4ade80;}
    .shot-title{font-weight:600;color:var(--text);line-height:1.4;}
    .shot-note{font-size:12px;color:#64748b;line-height:1.5;}
    .shot-gear{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px;}
    @media(max-width:500px){
      .shot-row{grid-template-columns:1fr;}
      .shot-frame{width:100%;justify-self:center;height:auto;aspect-ratio:16/9;border-right:none;border-bottom:1.5px solid var(--gray-200);}
    }
    .gear-badge{border-radius:6px;padding:2px 7px;font-size:10px;font-weight:600;}
    .gear-badge.lumix{background:#dbeafe;color:#1e40af;}.gear-badge.osmo{background:#cffafe;color:#0e7490;}
    .gear-badge.drone{background:#fce7f3;color:#9d174d;}.gear-badge.insta{background:#ffedd5;color:#c2410c;}
    .gear-badge.audio{background:#f0fdf4;color:#166534;}.gear-badge.phone{background:var(--gray-100);color:var(--gray-700);}
    .toolkit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
    .toolkit-item{background:var(--gray-100);border-radius:10px;padding:12px 14px;}
    .toolkit-item .tk-type{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:6px;}
    .toolkit-item .tk-shots{font-size:12px;color:var(--gray-700);}
    .toolkit-item .tk-shots li{margin-bottom:3px;list-style:none;padding-left:12px;position:relative;}
    .toolkit-item .tk-shots li::before{content:'→';position:absolute;left:0;color:var(--gray-400);}
    .settings-table{width:100%;border-collapse:collapse;font-size:13px;}
    .settings-table th{text-align:left;padding:8px 10px;background:var(--gray-100);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:var(--gray-400);}
    .settings-table td{padding:9px 10px;border-bottom:1px solid var(--gray-200);vertical-align:top;}
    .settings-table tr:last-child td{border-bottom:none;}
    .settings-table td:first-child{font-weight:600;color:var(--blue);width:130px;}
    .checklist{list-style:none;}
    .checklist li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--gray-200);font-size:13px;color:var(--gray-700);}
    .checklist li:last-child{border-bottom:none;}
    .checklist li::before{content:'☐';font-size:15px;flex-shrink:0;color:var(--sky);}
    .checklist li strong{color:var(--text);}
    .tip-box{background:#f0f9ff;border:1px solid #bae6fd;border-radius:10px;padding:10px 14px;font-size:13px;color:#0369a1;margin-top:12px;}
    .tip-box strong{display:block;margin-bottom:2px;}
    .edit-row{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--gray-200);font-size:13px;align-items:baseline;}
    .edit-row:last-child{border-bottom:none;}
    .edit-label{font-weight:700;color:var(--gift-green);font-size:12px;}
    .edit-val{color:var(--gray-700);}
    

    
    #lang-toggle{position:fixed;top:12px;right:12px;z-index:500;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);color:#fff;border-radius:20px;padding:0 12px;height:38px;font-size:12px;font-weight:700;letter-spacing:0.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);transition:background 0.2s,transform 0.2s;box-shadow:0 2px 8px rgba(0,0,0,0.25);white-space:nowrap;}
    #lang-toggle:hover{transform:scale(1.05);background:rgba(255,255,255,0.25);}
    footer{text-align:center;padding:24px 16px;font-size:12px;color:var(--gray-400);}
  
    .draft-pill{display:inline-block;margin-top:14px;background:rgba(244,162,97,0.18);border:1px solid rgba(244,162,97,0.5);border-radius:10px;padding:6px 12px;font-size:12px;max-width:640px;}
    .hero-shot{margin-top:14px;}
    .tip-box b{font-weight:700;}
    html[lang=th] body{font-family:-apple-system,BlinkMacSystemFont,'Sukhumvit Set','Thonburi','Segoe UI',sans-serif;}
    .shot-frame{align-self:start;border:0;border-radius:8px;cursor:zoom-in;padding:0;}
    .shot-art{filter:grayscale(1);display:flex;align-items:center;justify-content:center;position:absolute;inset:0;background:#faf9f6;}
    .shot-panel{display:block;flex:none;background-repeat:no-repeat;}
.shot-pending{background:repeating-linear-gradient(135deg,#f1f5f9 0 8px,#e2e8f0 8px 16px);color:#64748b;font-size:10px;font-weight:600;text-align:center;line-height:1.3;padding:6px;}
    .reference-note{font-size:11px;color:#64748b;margin:0 0 12px;}
    .shot-frame:focus-visible{outline:3px solid var(--teal);outline-offset:2px;}
    .preview-dialog{border:0;border-radius:14px;padding:16px;width:min(900px,94vw);max-height:94vh;overflow:auto;margin:auto;background:#0b1525;color:white;}
    .preview-dialog::backdrop{background:rgba(0,0,0,.78);}
    .preview-image{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:8px;margin:12px auto;}
    .preview-close{float:right;background:#26384f;color:white;border:0;border-radius:6px;padding:6px 12px;cursor:pointer;}
    .preview-caption{font-size:14px;}
    @media(max-width:640px){.shot-row{grid-template-columns:1fr;}.shot-frame{width:100%;justify-self:center;}}
    .vertical-note{font-size:12px;color:#4338ca;background:#eef2ff;padding:8px 10px;border-radius:7px;margin-top:6px;}
    .vertical-guide{font-size:13px;line-height:1.6;color:#3730a3;background:#eef2ff;border-radius:8px;padding:12px 14px;margin-bottom:12px;}
    .route-svg-wrap{background:var(--gray-100);border-radius:12px;padding:12px;margin-bottom:14px;}
    .route-svg-wrap svg{display:block;width:100%;height:auto;}
    .route-legend{display:flex;flex-wrap:wrap;gap:10px 16px;font-size:12px;color:var(--gray-700);margin-bottom:18px;}
    .route-legend span{display:inline-flex;align-items:center;gap:6px;}
    .route-legend .sw{width:10px;height:10px;border-radius:50%;display:inline-block;}
    .route-day{border-left:4px solid var(--gray-400);background:var(--gray-100);border-radius:0 10px 10px 0;padding:12px 14px;margin-bottom:12px;}
    .route-day-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;}
    .route-day-pill{color:white;font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px;letter-spacing:0.4px;}
    .route-day-head strong{font-size:14px;color:var(--navy);}
    .route-stops{list-style:none;}

 ['detail','cu','After the last class — school bag down, suitcase up','Your daughter home from school on Friday: uniform, school bag on the floor, suitcase by the door. The trip starts after the last bell, and this opens Act I.','เลิกเรียนคาบสุดท้าย — วางกระเป๋านักเรียน หยิบกระเป๋าเดินทาง','ลูกสาวกลับจากโรงเรียนวันศุกร์: ชุดนักเรียน กระเป๋านักเรียนวางบนพื้น กระเป๋าเดินทางรออยู่ที่ประตู ทริปเริ่มหลังเสียงออดเลิกเรียน และใช้เปิดองก์ 1',[OP]],
 ['detail','cu','The family chat — the others already in Japan','Phone screen on Friday afternoon as photos arrive from Narita: the main group landing, the Mystays lobby, a dinner without you. Ask them beforehand to film their own take-off and arrival on a phone, so they are in Act I too.','แชตครอบครัว — คนอื่นถึงญี่ปุ่นแล้ว','จอโทรศัพท์บ่ายวันศุกร์ ตอนรูปจากนาริตะทยอยเข้ามา: กลุ่มใหญ่ลงเครื่อง ล็อบบี้ Mystays มื้อเย็นที่ไม่มีเรา ขอไว้ล่วงหน้าให้ถ่ายตอนเครื่องขึ้นและตอนถึงด้วยโทรศัพท์ จะได้มีพวกเขาในองก์ 1 ด้วย',[PH]],
 ['establish','ap','Suvarnabhumi check-in at night — a short line of suitcases','Only the night-flight group and their bags. Hold one wide. Small on purpose: on D6 the hotel lobby fills with 30+ suitcases, and the film comes back to this frame.','เช็กอินสุวรรณภูมิยามค่ำ — กระเป๋าแถวสั้นๆ','มีแค่กลุ่มไฟลต์กลางคืนกับกระเป๋า ถ่ายมุมกว้างค้างไว้หนึ่งช็อต ตั้งใจให้เล็ก: ใน D6 ล็อบบี้โรงแรมจะเต็มไปด้วยกระเป๋า 30+ ใบ แล้วหนังจะย้อนกลับมาที่เฟรมนี้',[L35]],
 ['detail','cu','The headcount — a short one','The recurring motif of the film starts small: only the night-flight group. Film the lips and the pointing finger. The full count waits for Narita on the 5th.','การนับหัว — รอบสั้นๆ','โมทีฟที่วนกลับมาตลอดเรื่องเริ่มจากเล็กๆ: มีแค่กลุ่มไฟลต์กลางคืน ถ่ายปากและนิ้วที่ชี้ การนับครบทั้งบ้านรอไว้ที่นาริตะวันที่ 5',[OP]],
 ['reaction','fa','Kids at the gate window, faces close to the glass','Plane outside, kids in pyjamas. Don’t call them — wait for them to point.','เด็กๆ ที่หน้าต่างเกต หน้าชิดกระจก','เครื่องบินอยู่ข้างนอก เด็กๆ ใส่ชุดนอน ไม่ต้องเรียก — รอให้ชี้เอง',[OP]],
 ['broll','wn','Night take-off — Bangkok lights falling away','Phone flat against the window. 20 seconds is enough.','เครื่องขึ้นกลางคืน — ไฟกรุงเทพฯ ค่อยๆ ไกลออกไป','วางโทรศัพท์แนบกระจก 20 วินาทีพอ',[PH]],
 ['reaction','fa','Asleep in the cabin','Quiet, low, no flash. Your daughter asleep after a full school week: the tired, honest end of the first night.','หลับบนเครื่อง','เงียบ มุมต่ำ ไม่ใช้แฟลช ลูกสาวหลับหลังเรียนมาทั้งสัปดาห์ ปิดคืนแรกแบบเหนื่อยและจริง',[OP]],
 ['broll','dw','Dawn approach into Narita','Landing 06:20 is just before sunrise in early December: a deep-blue sky turning pink over the Chiba fields. If Fuji shows on the horizon — free bonus shot.','รุ่งอรุณก่อนลงจอดนาริตะ','ลงจอด 06:20 ก่อนพระอาทิตย์ขึ้นเล็กน้อยในต้นเดือนธันวาคม ฟ้าสีน้ำเงินเข้มค่อยๆ เป็นสีชมพูเหนือทุ่งชิบะ ถ้าเห็นฟูจิที่ขอบฟ้า — ได้ช็อตโบนัสฟรี',[PH]]
 ]},
{c:'#991b1b,#ea580c',
 en:{l:'Day 1 · Act I',n:'Narita → Atami Red Leaves → Mt Komuro → KAI Anjin',d:'Sat 5 Dec · Arrival, momiji at Atami Baien, the sea from Mt Komuro, first ryokan night',m:'The morning everyone finally shares one coach. Shoot the reunion, then let the red leaves wake everyone up.'},
 th:{l:'วันที่ 1 · องก์ 1',n:'นาริตะ → ใบไม้แดงอาตามิ → เขาโคมุโระ → KAI Anjin',d:'ส. 5 ธ.ค. · ถึงญี่ปุ่น ใบไม้แดงที่อาตามิไบเอ็น ทะเลจากเขาโคมุโระ คืนแรกที่เรียวกัง',m:'เช้าที่ทุกคนได้ขึ้นรถบัสคันเดียวกันในที่สุด ถ่ายตอนได้เจอกัน แล้วปล่อยให้ใบไม้แดงปลุกทุกคนให้ตื่น'},
 s:[
 ['reaction','fa','The reunion — Narita arrivals, Saturday morning','You walk out of T1 arrivals after a night on the plane (out around 07:30), and the rest of the family is waiting — or you take the hotel shuttle and find them in the Mystays breakfast room. Either way, this is the first time the cousins see each other. Ask someone on their side to film you coming through the doors on a phone, while your Osmo films the kids spotting each other. Then everyone boards the coach together.','ได้เจอกัน — ประตูขาเข้านาริตะ เช้าวันเสาร์','บ้านเราเดินออกจากประตูขาเข้า T1 หลังนั่งเครื่องมาทั้งคืน (ออกมาราว 07:30) และครอบครัวที่เหลือรออยู่ — หรือเรานั่งรถรับส่งของโรงแรมไปเจอกันที่ห้องอาหารเช้าของ Mystays ไม่ว่าแบบไหน นี่คือครั้งแรกที่ลูกพี่ลูกน้องได้เจอกัน ขอให้ใครสักคนฝั่งโน้นถ่ายตอนเราเดินออกประตูมาด้วยโทรศัพท์ ส่วน Osmo ของเราถ่ายตอนเด็กๆ เห็นกัน แล้วทุกคนขึ้นรถบัสพร้อมกัน',[OP,PH]],
 ['detail','cu','Headcount #2 — the first full count','Everyone together for the first time. Same finger, new country, a much longer count.','นับหัวครั้งที่ 2 — นับครบครั้งแรก','ทุกคนอยู่พร้อมหน้าครั้งแรก นิ้วเดิม ประเทศใหม่ นับยาวขึ้นมาก',[OP]],
 ['movement','ap','Luggage disappearing into the coach belly','Lock-off on the bus side as bag after bag goes in. Speed it up in post.','กระเป๋าหายเข้าไปใต้ท้องรถบัส','ตั้งกล้องนิ่งข้างรถ ให้กระเป๋าทยอยเข้าไปทีละใบ เร่งสปีดตอนตัดต่อ',[L35]],
 ['broll','bus','Coach window — the city falls away','Insta360 on a side window from Narita onward. On a clear morning Fuji may show on the right past Atsugi — a free early glimpse; the big reveal is planned for D3.','หน้าต่างรถบัส — เมืองค่อยๆ ไกลออกไป','ติด Insta360 ที่หน้าต่างข้างตั้งแต่ออกจากนาริตะ เช้าที่ฟ้าใสฟูจิอาจโผล่ทางขวาหลังผ่านอัตสึงิ — ได้เห็นก่อนฟรีๆ ส่วนภาพเผยฟูจิจริงวางไว้ที่ D3',[X5]],
 ['detail','fd','Ebina SA — vending machines, warm drinks, small hands','Osmo close. Kids choosing hot cans from the machine, steam from a cup. Ebina is the usual Tomei rest stop on the way to Atami.','Ebina SA — ตู้กดน้ำ เครื่องดื่มอุ่น มือเล็กๆ','Osmo ระยะใกล้ เด็กเลือกกระป๋องร้อนจากตู้ ไอน้ำลอยจากแก้ว Ebina คือจุดพักปกติบนทางด่วนโทเมไปอาตามิ',[OP]],
 ['hero','mj','Momiji canopy — backlit red, grandma walking under','Atami Baien, late morning. Shoot toward the sun through the leaves, Noctilux wide open. The garden is on a slope: let grandma choose how far up she walks.','อุโมงค์ใบไม้แดง — ย้อนแสง คุณยายเดินใต้ร่มใบไม้','อาตามิไบเอ็นช่วงสายๆ ถ่ายย้อนแดดผ่านใบไม้ Noctilux เปิดสุด สวนเป็นเนินลาด ให้คุณยายเลือกเองว่าจะเดินขึ้นไปแค่ไหน',[N50],2],
 ['broll','mj','The stream through Atami Baien — small bridges under red leaves','90mm from the bank so the family crossing a little bridge sits inside layers of red and yellow. Kids leaning over the rail to look at the water.','ลำธารในอาตามิไบเอ็น — สะพานเล็กใต้ใบไม้แดง','90mm จากริมตลิ่ง ให้ครอบครัวที่กำลังข้ามสะพานเล็กอยู่ในชั้นใบไม้แดงเหลือง เด็กๆ ชะโงกดูน้ำจากราวสะพาน',[A90]],
 ['detail','cu','A single red leaf in a child’s palm','Noctilux close (70cm minimum — or Osmo if closer). The visual rhyme for the whole momiji sequence.','ใบไม้แดงใบเดียวบนฝ่ามือเด็ก','Noctilux ระยะใกล้ (ใกล้สุด 70 ซม. — ใกล้กว่านั้นใช้ Osmo) ภาพที่ร้อยเรียงทั้งซีเควนซ์ใบไม้แดง',[N50,OP]],
 ['audio','mj','Atami Baien stream — 60 seconds still','Running water, footsteps on gravel, leaves underfoot. This track can carry the whole momiji sequence.','ลำธารอาตามิไบเอ็น — นิ่ง 60 วินาที','เสียงน้ำไหล เสียงเดินบนกรวด เสียงใบไม้ใต้เท้า แทร็กนี้รองรับทั้งซีเควนซ์ใบไม้แดงได้',[MIC]],
 ['establish','vl','Mt Komuro chairlift rising up the hill','35mm from below as the chairs climb. Aim to arrive by 14:30 — the lift closes around 16:00 and stops in strong wind.','กระเช้าเก้าอี้เขาโคมุโระขึ้นเนินเขา','35mm ถ่ายจากด้านล่างตอนเก้าอี้ไต่ขึ้น ควรถึงก่อน 14:30 — กระเช้าปิดราว 16:00 และหยุดเมื่อลมแรง',[L35]],
 ['movement','vl','Insta360 on the chairlift — invisible-stick shot','Lanyard on your wrist — anything dropped is gone. Reframe in post.','Insta360 บนกระเช้า — ช็อตไม้เซลฟี่ล่องหน','คล้องสายข้อมือ — ของหล่นแล้วหายเลย รีเฟรมตอนตัดต่อ',[X5]],
 ['establish','vl','MISORA ridge walk — the sea from the summit','Osmo walk-with along the deck: Sagami Bay and Oshima island below, Fuji to the north on a clear day. The family as a line of small figures against the sky.','ทางเดินสันเขา MISORA — ทะเลจากยอดเขา','Osmo เดินตามไปบนทางเดิน: อ่าวซางามิและเกาะโอชิมะอยู่ด้านล่าง วันฟ้าใสเห็นฟูจิทางทิศเหนือ ครอบครัวเป็นแถวคนตัวเล็กๆ ตัดกับท้องฟ้า',[OP]],
 ['establish','ys','KAI Anjin arrival at dusk — shoes lined at the entrance','The genkan full of 30+ pairs of shoes. One frame says "the whole family is here". KAI Anjin is about 15 minutes from Mt Komuro.','ถึง KAI Anjin ยามโพล้เพล้ — รองเท้าเรียงที่ทางเข้า','เก็งกังเต็มไปด้วยรองเท้า 30+ คู่ เฟรมเดียวบอกว่า "ครอบครัวมาครบแล้ว" KAI Anjin อยู่ห่างเขาโคมุโระราว 15 นาที',[L35]],
 ['hero','ys','Yukata night — kids in the ryokan corridor','Low, from behind, one take. 25fps · 1/50.','คืนยูกาตะ — เด็กๆ ในทางเดินเรียวกัง','มุมต่ำ จากด้านหลัง เทคเดียว 25fps · 1/50',[OP],5],
 ['present','fd','First kaiseki dinner','One wide of the long table if you want. Then the camera goes in the bag.','มื้อไคเซกิแรก','ถ่ายโต๊ะยาวมุมกว้างหนึ่งช็อตถ้าอยากได้ แล้วเก็บกล้องลงกระเป๋า',[]],
 ['nocam','ys','Onsen — never','No cameras in or near the baths. Absolute rule — law, privacy, respect.','ออนเซ็น — ห้ามเด็ดขาด','ห้ามกล้องในหรือใกล้บ่อแช่ กฎเด็ดขาด — ทั้งกฎหมาย ความเป็นส่วนตัว และมารยาท',[]]
 ]},
{c:'#075985,#0ea5e9',
 en:{l:'Day 2 · Act II',n:'South Izu Coast — Seafood, White Sand, the Sea',d:'Sun 6 Dec · Route 135 down the east coast → seafood lunch in a harbour town → Izu Shirahama → back to KAI Anjin',m:'The heart of the film. A slow day by the sea for every generation. Arrive at Shirahama and walk the sand with grandma for five minutes before you film anything.'},
 th:{l:'วันที่ 2 · องก์ 2',n:'ชายฝั่งอิซุใต้ — ซีฟู้ด ทรายขาว ทะเล',d:'อา. 6 ธ.ค. · ถนน 135 เลียบชายฝั่งตะวันออก → มื้อกลางวันซีฟู้ดในเมืองท่า → อิซุชิราฮามะ → กลับ KAI Anjin',m:'หัวใจของหนัง วันช้าๆ ริมทะเลสำหรับทุกรุ่น ถึงชิราฮามะแล้วเดินบนทรายกับคุณยายห้านาทีก่อนจะถ่ายอะไร'},
 s:[
 ['establish','bus','Coast road reveal — the sea on the left all the way south','Insta360 on a left-side window down Route 135: cliffs, small harbours, the open Pacific. The transition from Act I to Act II.','ภาพเผยถนนเลียบชายฝั่ง — ทะเลอยู่ทางซ้ายตลอดทางลงใต้','Insta360 ติดหน้าต่างฝั่งซ้ายตลอดถนน 135: หน้าผา ท่าเรือเล็กๆ มหาสมุทรแปซิฟิก รอยต่อจากองก์ 1 สู่องก์ 2',[X5]],
 ['detail','fd','Seafood lunch — kinmedai, grilled shellfish, first bites','Shimoda or another harbour town on the way. Osmo close on the grill or the red kinmedai, then the kids’ faces trying something new. Book the group table ahead: it is a Sunday at peak season.','มื้อกลางวันซีฟู้ด — ปลาคินเมได หอยย่าง คำแรก','ชิโมดะหรือเมืองท่าอื่นระหว่างทาง Osmo ใกล้ๆ ที่เตาย่างหรือปลาคินเมไดสีแดง แล้วหน้าเด็กๆ ตอนลองของใหม่ จองโต๊ะกลุ่มไว้ก่อน วันอาทิตย์ช่วงไฮซีซัน',[OP]],
 ['broll','wv','Harbour-town walk — fishing boats, narrow streets','35mm. Grandparents and kids walking together past the boats. One wide, one walk-with, then move on.','เดินเล่นเมืองท่า — เรือประมง ซอยแคบ','35mm ปู่ย่าตายายกับเด็กๆ เดินด้วยกันผ่านเรือประมง มุมกว้างหนึ่ง เดินตามหนึ่ง แล้วไปต่อ',[L35,OP]],
 ['present','wv','First five minutes on Shirahama','Don’t touch the camera. Take off your shoes, walk the sand next to grandma and look at the sea. This one is for memory.','ห้านาทีแรกที่ชิราฮามะ','อย่าแตะกล้อง ถอดรองเท้า เดินบนทรายข้างคุณยายแล้วมองทะเล ช่วงนี้เก็บไว้ในความทรงจำ',[]],
 ['hero','wv','Shirahama — white sand, the torii on the rock, surf','90mm from along the beach to stack the torii rock against the surf. Tripod. Then a 35mm wide with the family along the waterline.','ชิราฮามะ — ทรายขาว โทริอิบนโขดหิน และคลื่น','90mm จากริมหาดให้โขดหินโทริอิซ้อนกับคลื่น ใช้ขาตั้ง แล้ว 35mm มุมกว้างมีครอบครัวเรียงริมน้ำ',[A90,L35,TRI],1],
 ['movement','wv','Slow-motion surf on the rocks at the end of the beach','4K 60fps, 90mm, ND filter. Hold 15 seconds — you will slow it down in the edit.','สโลว์โมชันคลื่นแตกบนโขดหินปลายหาด','4K 60fps, 90mm, ฟิลเตอร์ ND ค้าง 15 วินาที — ไว้ทำสโลว์ตอนตัดต่อ',[A90]],
 ['hero','gp','Four generations — one frame','Hands detail first (Noctilux), then the one posed group shot of all 30+ on the sand, sea and torii rock behind. Tripod + interval timer. In 16:9, spread into three or four rows arranged like the last trip’s group photo.','สี่รุ่น — ในเฟรมเดียว','ถ่ายมือก่อน (Noctilux) แล้วภาพหมู่จัดท่าภาพเดียว 30+ คนบนหาดทราย ทะเลและโขดหินโทริอิอยู่ข้างหลัง ขาตั้ง + ตั้งเวลาถ่ายรัว เฟรม 16:9 กางเป็นสามหรือสี่แถว จัดเหมือนภาพหมู่ทริปก่อน',[N50,L35,TRI],3],
 ['reaction','gp','Household portraits — one per family, same spot','Right after the group shot, while everyone is still there: each household steps in for 5 seconds of video, same framing, sea behind. Lock the tripod and don’t move it. Nobody is left out of the keepsake; these become the end credits.','ภาพครอบครัวย่อย — บ้านละหนึ่งช็อต จุดเดียวกัน','ต่อจากภาพหมู่ทันที ตอนทุกคนยังอยู่: แต่ละบ้านเข้ามายืนถ่ายวิดีโอ 5 วินาที เฟรมเดิม ทะเลอยู่ข้างหลัง ล็อกขาตั้งไว้ไม่ขยับ ไม่มีใครตกหล่นจากของที่ระลึก ช็อตพวกนี้คือเอนด์เครดิต',[L35,TRI]],
 ['reaction','fa','Kids, two years on — one portrait each','Each child, 3 seconds, standing straight, looking at the lens, same distance. Repeat exactly on the next family trip — the series is the point. Noctilux at f/2 so the eyes stay sharp.','เด็กๆ ผ่านไปสองปี — คนละหนึ่งพอร์เทรต','เด็กแต่ละคน 3 วินาที ยืนตรง มองเลนส์ ระยะเท่ากัน ถ่ายซ้ำแบบเดิมในทริปครอบครัวครั้งหน้า — ความต่อเนื่องคือหัวใจ Noctilux ที่ f/2 ให้ตาคมชัด',[N50]],
 ['movement','gp','Drone pull-back — family on the sand → the bay','ONLY if registered, the local rules allow it, you stay away from the shrine, and you keep 30 m from strangers. A public beach on a Sunday may rule it out — if in doubt, skip; the S9 shots already carry it.','โดรนบินถอยหลัง — ครอบครัวบนหาด → อ่าว','ทำเฉพาะเมื่อลงทะเบียนแล้ว กฎท้องถิ่นอนุญาต อยู่ห่างศาลเจ้า และห่างคนแปลกหน้า 30 ม. หาดสาธารณะวันอาทิตย์อาจบินไม่ได้ — ถ้าไม่แน่ใจให้ข้าม ช็อต S9 เพียงพอแล้ว',[DR]],
 ['audio','wv','Shirahama waves — 60 seconds still','Camera on the sand, nobody talking. The sound bed for the cold open.','เสียงคลื่นชิราฮามะ — นิ่ง 60 วินาที','วางกล้องบนทราย ไม่มีใครพูด เป็นเสียงพื้นของฉากเปิดเรื่อง',[MIC]],
 ['reaction','fa','Kids running from the waves','Osmo low at the waterline. Shoes off, trousers rolled, shrieking at the cold December water. Grandma watching from the dry sand behind them.','เด็กๆ วิ่งหนีคลื่น','Osmo ต่ำระดับน้ำ ถอดรองเท้า พับขากางเกง กรี๊ดเพราะน้ำทะเลเดือนธันวาคมเย็น คุณยายนั่งดูอยู่บนทรายแห้งข้างหลัง',[OP]],
 ['reaction','fa','Grandma looking at the sea — from a distance','90mm from 15 metres away so she doesn’t notice. Hold until she turns away.','คุณยายมองทะเล — จากระยะไกล','90mm จากระยะ 15 เมตร ให้ท่านไม่รู้ตัว ค้างไว้จนท่านหันไปทางอื่น',[A90]],
 ['broll','bus','The sleeping bus — kids asleep in rows on the way back','Insta360 on the ceiling or seat back. The Act II exhale.','รถบัสหลับ — เด็กๆ หลับเรียงแถวขากลับ','Insta360 ติดเพดานหรือพนักเบาะ จังหวะผ่อนลมหายใจขององก์ 2',[X5]],
 ['audio','fa','Grandma’s voice — one question','Before dinner, somewhere quiet in the ryokan. Ask one thing: “What do you remember from our first family trip?” Record 20–30 seconds — you only need the sound. Then the same question to one person from dad’s generation. The only talking in the whole film.','เสียงคุณยาย — คำถามเดียว','ก่อนมื้อเย็น หามุมเงียบในเรียวกัง ถามเรื่องเดียว: “จำอะไรได้บ้างจากทริปครอบครัวครั้งแรก?” อัด 20–30 วินาที — ใช้แค่เสียง แล้วถามคำถามเดียวกันกับรุ่นคุณพ่อหนึ่งคน เป็นเสียงพูดเดียวในหนังทั้งเรื่อง',[['audio','DJI Mic / S9 mic'],OP]],
 ['establish','ys','The whole-family dinner — everyone in yukata, the toast','The reunion dinner. One wide of the full room from the doorway, then the toast: glasses up, grandma in the centre. If she says a few words, keep rolling. 25fps · 1/50.','มื้อเย็นรวมญาติ — ทุกคนใส่ยูกาตะ ชนแก้ว','มื้อเย็นของการรวมญาติ มุมกว้างหนึ่งช็อตเห็นทั้งห้องจากประตู แล้วตอนชนแก้ว: ยกแก้วขึ้น คุณยายอยู่ตรงกลาง ถ้าท่านพูดอะไรสักสองสามคำ ถ่ายต่อไป 25fps · 1/50',[L35,OP]],
 ['present','ys','After the toast — the rest of the night','Camera in the bag. This dinner is why the family travels together.','หลังชนแก้ว — ที่เหลือของค่ำคืน','เก็บกล้องลงกระเป๋า มื้อนี้คือเหตุผลที่ครอบครัวเดินทางด้วยกัน',[]]
 ]},
{c:'#78350f,#b45309',
 en:{l:'Day 3 · Act II',n:'Shuzenji → Kakitagawa → Mishima Skywalk → Ginza',d:'Mon 7 Dec · Hot-spring town, spring water, Fuji from the bridge, into the city',m:'The road north out of Izu. The coach becomes the transition: from a temple town, to clear spring water, to Fuji, to city lights.'},
 th:{l:'วันที่ 3 · องก์ 2',n:'ชูเซ็นจิ → คาคิตะกาวะ → มิชิมะสกายวอล์ก → กินซ่า',d:'จ. 7 ธ.ค. · เมืองออนเซ็น น้ำพุใส ฟูจิจากสะพาน เข้าเมือง',m:'ถนนขึ้นเหนือออกจากอิซุ รถบัสคือรอยต่อ: จากเมืองวัด สู่น้ำพุใส สู่ฟูจิ สู่แสงไฟในเมือง'},
 s:[
 ['reaction','fa','Kids bowing goodbye to the ryokan staff','35mm, natural. Japanese staff wave until the bus is out of sight — film that from the back window.','เด็กๆ โค้งลาพนักงานเรียวกัง','35mm ตามธรรมชาติ พนักงานญี่ปุ่นจะโบกมือจนรถลับตา — ถ่ายจากหน้าต่างหลังรถ',[L35,OP]],
 ['broll','tp','Shuzenji — the temple and the Katsura River maples','35mm. The second chance at red leaves: maples along the river and around the temple. The temple’s special autumn garden opening has usually ended by early December — film from the grounds and the river. No filming inside the hall.','ชูเซ็นจิ — วัดและใบไม้แดงริมแม่น้ำคัตสึระ','35mm โอกาสที่สองของใบไม้แดง: เมเปิ้ลริมแม่น้ำและรอบวัด สวนวัดที่เปิดพิเศษช่วงใบไม้แดงมักปิดแล้วในต้นเดือนธันวาคม — ถ่ายจากลานวัดและริมแม่น้ำ ห้ามถ่ายในหอวัด',[L35]],
 ['movement','tp','Shuzenji bamboo path — walk-with','Osmo at chest height walking with the family through the bamboo. Short and flat — good for grandma.','ทางเดินป่าไผ่ชูเซ็นจิ — เดินตาม','Osmo ระดับอก เดินไปพร้อมครอบครัวผ่านป่าไผ่ ทางสั้นและเรียบ — เหมาะกับคุณยาย',[OP]],
 ['hero','bus','"Fuji-san!" — reveal from the coach window','Insta360 on a front side window as the coach heads north to Mishima. Fuji rises straight ahead.','"ฟูจิซัง!" — ภาพเผยจากหน้าต่างรถบัส','ติด Insta360 ที่หน้าต่างข้างด้านหน้าตอนรถมุ่งเหนือไปมิชิมะ ฟูจิโผล่ตรงหน้า',[X5],4],
 ['detail','cu','Headcount #3 — Kakitagawa car park','The motif again. Kids now count themselves.','นับหัวครั้งที่ 3 — ลานจอดรถคาคิตะกาวะ','โมทีฟกลับมาอีก ตอนนี้เด็กๆ นับกันเอง',[OP]],
 ['establish','wv','Kakitagawa — spring water boiling up through the sand','From the viewing deck, 90mm down into the blue pool where Fuji’s snowmelt pushes up through the sand. Then 35mm wide with the kids leaning over the rail.','คาคิตะกาวะ — น้ำพุผุดขึ้นจากทราย','จากระเบียงชม 90mm ลงไปที่บ่อสีฟ้าที่น้ำจากหิมะฟูจิดันขึ้นมาผ่านทราย แล้ว 35mm มุมกว้างมีเด็กๆ ชะโงกดูที่ราว',[A90,L35]],
 ['audio','wv','Kakitagawa spring — 60 seconds still','Running water, birds, the river under the boardwalk. A clean sound bed between the temple and Fuji.','น้ำพุคาคิตะกาวะ — นิ่ง 60 วินาที','เสียงน้ำไหล นก แม่น้ำใต้ทางเดินไม้ เสียงพื้นสะอาดๆ ระหว่างวัดกับฟูจิ',[MIC]],
 ['hero','fj','Mishima Skywalk — Fuji beside the bridge, scale through a child','90mm from the start of the bridge, then 35mm low behind grandma.','มิชิมะสกายวอล์ก — ฟูจิข้างสะพาน ขนาดผ่านสายตาเด็ก','90mm จากต้นสะพาน แล้ว 35mm มุมต่ำหลังคุณยาย',[A90,L35],6],
 ['reaction','fa','Grandma looking at Fuji — from a distance','90mm from 15 metres away so she doesn’t notice. Hold until she turns away.','คุณยายมองฟูจิ — จากระยะไกล','90mm จากระยะ 15 เมตร ให้ท่านไม่รู้ตัว ค้างไว้จนท่านหันไปทางอื่น',[A90]],
 ['broll','bus','Fuji in the window at dusk — the Tomei heading east','Insta360 on a left-side window. Fuji slides past as a dark silhouette against an orange sky, then is gone.','ฟูจิในหน้าต่างยามโพล้เพล้ — ทางด่วนโทเมมุ่งตะวันออก','Insta360 ติดหน้าต่างฝั่งซ้าย ฟูจิเลื่อนผ่านเป็นเงาดำตัดฟ้าสีส้ม แล้วก็หายไป',[X5]],
 ['establish','nt','Coach into Tokyo at night — the coast becomes the city','Insta360 on the window as the expressway lights thicken. The transition into Act III.','รถบัสเข้าโตเกียวยามค่ำ — ชายฝั่งกลายเป็นเมือง','Insta360 ติดหน้าต่างตอนแสงไฟทางด่วนหนาขึ้น รอยต่อสู่องก์ 3',[X5]],
 ['detail','bus','The empty coach — last look','After everyone gets off in Ginza: one Osmo shot down the empty aisle. The end of "one bus".','รถบัสว่างเปล่า — มองครั้งสุดท้าย','หลังทุกคนลงที่กินซ่า: Osmo หนึ่งช็อตตามทางเดินว่างๆ จุดจบของ "หนึ่งรถบัส"',[OP]]
 ]},
{c:'#9d174d,#ec4899',
 en:{l:'Day 4 · Act III',n:'Tokyo Disneyland',d:'Tue 8 Dec · Christmas season',m:'The family splits into small groups today. Film only your own group — trying to cover everyone is how you miss everything.'},
 th:{l:'วันที่ 4 · องก์ 3',n:'โตเกียวดิสนีย์แลนด์',d:'อ. 8 ธ.ค. · ช่วงคริสต์มาส',m:'วันนี้ครอบครัวแยกเป็นกลุ่มเล็ก ถ่ายแค่กลุ่มของตัวเอง — พยายามถ่ายทุกคนคือวิธีพลาดทุกอย่าง'},
 s:[
 ['establish','ds','Gate opening — the crowd moving in','One wide from the entrance plaza. Then put the camera away until you are inside.','ประตูเปิด — ฝูงชนไหลเข้า','มุมกว้างหนึ่งช็อตจากลานทางเข้า แล้วเก็บกล้องจนกว่าจะเข้าไปข้างใน',[L35]],
 ['reaction','fa','Your daughter’s first sight of the castle','35mm, from the side, not the front. Don’t say "look!" — let her find it.','ลูกสาวเห็นปราสาทครั้งแรก','35mm จากด้านข้าง ไม่ใช่ด้านหน้า อย่าพูดว่า "ดูสิ!" — ปล่อยให้เธอเห็นเอง',[L35]],
 ['detail','cu','Mouse ears across three generations','Osmo — a row of headbands on grandparents, parents and kids. Grandpa in ears is the shot.','ที่คาดผมหูมิกกี้สามรุ่น','Osmo — แถวที่คาดผมบนหัวปู่ย่า พ่อแม่ และเด็กๆ คุณตาใส่หูมิกกี้คือช็อตเด็ด',[OP]],
 ['broll','ds','Christmas tree + decorations','35mm. One wide, one detail of ornaments. No more.','ต้นคริสต์มาส + ของตกแต่ง','35mm มุมกว้างหนึ่ง รายละเอียดของประดับหนึ่ง พอแค่นั้น',[L35]],
 ['hero','ds','Disney night — the uncaptured moment','Film the waiting at blue hour. Camera off when the show starts.','คืนดิสนีย์ — ช่วงเวลาที่ไม่ถูกบันทึก','ถ่ายช่วงรอยามบลูอาวร์ ปิดกล้องเมื่อโชว์เริ่ม',[L35,OP],7],
 ['nocam','ds','The night show itself','Watch it. Hold your daughter. The film already has everything it needs.','ตัวโชว์กลางคืน','ดูโชว์ กอดลูกสาวไว้ หนังมีทุกอย่างที่ต้องการแล้ว',[]]
 ]},
{c:'#1e3a8a,#6366f1',
 en:{l:'Day 5 · Act III',n:'Tokyo Free Day',d:'Wed 9 Dec · Ginza / Marunouchi · the last full day with everyone',m:'Unscripted: follow whichever small group you’re with, light kit. Tonight is the last night the whole family sleeps under one roof — no need to film it.'},
 th:{l:'วันที่ 5 · องก์ 3',n:'วันอิสระในโตเกียว',d:'พ. 9 ธ.ค. · กินซ่า / มารุโนะอุจิ · วันเต็มวันสุดท้ายที่อยู่กันครบ',m:'ไม่มีสคริปต์: ตามกลุ่มเล็กที่อยู่ด้วย อุปกรณ์เบาๆ คืนนี้คือคืนสุดท้ายที่ทั้งครอบครัวนอนใต้หลังคาเดียวกัน — ไม่ต้องถ่าย'},
 s:[
 ['broll','nt','Ginza 4-chome crossing — the crowd washing past','Lock-off from the corner, 30 seconds. Your family in the middle of the crowd if you can.','ทางแยกกินซ่า 4-โจเมะ — ฝูงชนไหลผ่าน','ตั้งกล้องนิ่งจากมุมถนน 30 วินาที ถ้าได้ ให้ครอบครัวอยู่กลางฝูงชน',[L35]],
 ['reaction','fa','Grandma in the depachika food hall','Osmo from the hip. Her face at the wagashi counter.','คุณยายในฟู้ดฮอลล์ใต้ห้าง','Osmo ระดับสะโพก หน้าท่านที่เคาน์เตอร์ขนมวากาชิ',[OP]],
 ['establish','nt','Tokyo Station Marunouchi facade — blue hour','Noctilux on a tripod, ~16:30–17:00. The Leica glow on the red brick and lights. The city signature shot.','อาคารสถานีโตเกียวฝั่งมารุโนะอุจิ — บลูอาวร์','Noctilux บนขาตั้ง ~16:30–17:00 Leica Glow บนอิฐแดงและแสงไฟ ช็อตลายเซ็นของเมือง',[N50,TRI]],
 ['broll','nt','Marunouchi Naka-dori illumination — champagne-gold trees','Noctilux handheld, wide open. Kids walking under the lit trees.','ไฟประดับถนนนากาโดริ มารุโนะอุจิ — ต้นไม้สีทองแชมเปญ','Noctilux ถือมือ เปิดสุด เด็กๆ เดินใต้ต้นไม้ประดับไฟ',[N50]],
 ['audio','nt','Station concourse — 60 seconds','Announcements, footsteps, train chimes. Tokyo in one sound.','โถงสถานี — 60 วินาที','เสียงประกาศ เสียงฝีเท้า เสียงเมโลดี้รถไฟ โตเกียวในเสียงเดียว',[MIC]],
 ['present','fd','The last night all together','Dinner wherever the family ends up. The camera stays in the room.','คืนสุดท้ายที่อยู่กันครบ','มื้อเย็นที่ไหนก็ได้ที่ครอบครัวไปรวมกัน กล้องอยู่ในห้องพัก',[]]
 ]},
{c:'#334155,#64748b',
 en:{l:'Day 6 · Act III',n:'Goodbye — The Coach Leaves Without You',d:'Thu 10 Dec · the family leaves Daiwa Roynet Ginza by coach for Narita (~17:00 flight) · a few stay until 11–12 Dec · you fly from Haneda tonight (TG661, 00:20)',m:'The ending of the film. This time you are the one who stays: the family leaves first, and you are on the pavement to see them off. Film the lobby, the count and the coach — then put the camera away for your own last evening.'},
 th:{l:'วันที่ 6 · องก์ 3',n:'บอกลา — รถบัสออกไปโดยไม่มีเรา',d:'พฤ. 10 ธ.ค. · ครอบครัวออกจาก Daiwa Roynet กินซ่าด้วยรถบัสไปนาริตะ (ไฟลต์ ~17:00) · บางบ้านอยู่ต่อถึง 11–12 ธ.ค. · บ้านเราบินจากฮาเนดะคืนนี้ (TG661 เวลา 00:20)',m:'ฉากจบของหนัง ครั้งนี้เราเป็นฝ่ายที่อยู่: ครอบครัวไปก่อน และเรายืนส่งอยู่ริมทาง ถ่ายล็อบบี้ การนับหัว และรถบัส — แล้วเก็บกล้องไว้สำหรับเย็นสุดท้ายของบ้านเราเอง'},
 s:[
 ['establish','ap','30+ suitcases in the lobby — the long line','Same angle as the Suvarnabhumi frame on D0 if you can. The trip began with your short line; this is everyone’s. Lock off and let people walk through it.','กระเป๋า 30+ ใบในล็อบบี้ — แถวยาว','มุมเดียวกับเฟรมสุวรรณภูมิใน D0 ถ้าทำได้ ทริปเริ่มด้วยแถวสั้นๆ ของบ้านเรา ตรงนี้คือแถวของทุกคน ตั้งกล้องนิ่งแล้วปล่อยให้คนเดินผ่าน',[L35]],
 ['detail','cu','Final headcount — the lobby, everyone, one last time','The last time the whole family is in one place. Count here, before anyone boards. "...31, 32. Everyone." The last line of the film is a number.','นับหัวครั้งสุดท้าย — ล็อบบี้ ทุกคน ครั้งสุดท้าย','ครั้งสุดท้ายที่ทั้งครอบครัวอยู่ที่เดียวกัน นับตรงนี้ก่อนใครขึ้นรถ "...31, 32 ครบ" ประโยคสุดท้ายของหนังคือตัวเลข',[OP]],
 ['movement','ap','Luggage back into the coach belly','The same lock-off as at Narita on D1, in reverse. Speed it up in post.','กระเป๋ากลับเข้าใต้ท้องรถบัส','ตั้งกล้องนิ่งแบบเดียวกับที่นาริตะใน D1 แต่กลับกัน เร่งสปีดตอนตัดต่อ',[L35]],

SEC.en.philosophy=`<h2>🌿 The GiftLee Philosophy</h2>
<div class="philosophy-intro">"I don't care about a good photo. I care about honesty."<cite>— Nan Goldin, as cited by GiftLee</cite></div>
<p style="font-size:14px;color:var(--gray-700);margin-bottom:16px;">With thirty-plus people the temptation is to film <strong>everyone</strong>. Don't. This film is about one thing: <strong>four generations</strong> — from grandma to the 1-year-old — fitting into the same frame for one week. Pair old and young whenever you can. Let everyone else be background.</p>
<div class="question-framework"><h3>Before you lift the camera — three questions</h3><ul class="q-list">
<li><span class="q-num">1</span><span>Will this shot tell the emotional truth of this moment — or just prove we were here?</span></li>
<li><span class="q-num">2</span><span>If I film this, will I miss <strong>being in it</strong>? Is that trade worth it?</span></li>
<li><span class="q-num">3</span><span>Is this one of the <strong>7 Hero Shots</strong>? If not — does it serve the story, or is it a tourist checkbox?</span></li></ul></div>
<div class="section-label">Core Principles</div><div class="principles-grid">
<div class="principle"><div class="p-label">Honesty over perfection</div><div class="p-body">A slightly blurry shot of a real moment beats a sharp shot of a posed one. Always.</div></div>
<div class="principle"><div class="p-label">Generations in one frame</div><div class="p-body">The strongest shots have an old face and a young face together. Look for hands, shoulders, laps.</div></div>
<div class="principle"><div class="p-label">Find the quiet edge</div><div class="p-body">Thirty people are loud. Shoot from the back of the group, the end of the line, the far side of the beach.</div></div>
<div class="principle"><div class="p-label">Live the ending</div><div class="p-body">Shirahama’s first five minutes, the Disney night show, the coach pulling away — be there. The film has enough.</div></div></div>`;
SEC.th.philosophy=`<h2>🌿 ปรัชญาแบบ GiftLee</h2>
<div class="philosophy-intro">"ฉันไม่สนใจภาพที่สวย ฉันสนใจความจริง"<cite>— Nan Goldin ตามที่ GiftLee อ้างถึง</cite></div>
<p style="font-size:14px;color:var(--gray-700);margin-bottom:16px;">มีคนกว่าสามสิบคน ความอยากคือการถ่าย<strong>ทุกคน</strong> อย่าทำ หนังเรื่องนี้พูดเรื่องเดียว: <strong>สี่รุ่น</strong> — ตั้งแต่คุณยายถึงหลานวัย 1 ขวบ — ได้อยู่ในเฟรมเดียวกันตลอดหนึ่งสัปดาห์ จับคู่คนแก่กับเด็กเมื่อไรก็ได้ คนอื่นปล่อยเป็นฉากหลัง</p>
<div class="question-framework"><h3>ก่อนยกกล้อง — สามคำถาม</h3><ul class="q-list">
<li><span class="q-num">1</span><span>ช็อตนี้เล่าความจริงทางอารมณ์ของช่วงนี้ — หรือแค่พิสูจน์ว่าเรามาถึง?</span></li>
<li><span class="q-num">2</span><span>ถ้าถ่ายตอนนี้ ฉันจะพลาด<strong>การได้อยู่ในช่วงเวลานั้น</strong>ไหม? คุ้มไหม?</span></li>
<li><span class="q-num">3</span><span>นี่คือหนึ่งใน <strong>7 ช็อตฮีโร่</strong> ไหม? ถ้าไม่ใช่ — มันรับใช้เรื่องเล่า หรือแค่ติ๊กเช็กลิสต์นักท่องเที่ยว?</span></li></ul></div>
<div class="section-label">หลักการสำคัญ</div><div class="principles-grid">
<div class="principle"><div class="p-label">ความจริงเหนือความสมบูรณ์แบบ</div><div class="p-body">ช็อตเบลอนิดๆ ของช่วงเวลาจริง ชนะช็อตคมชัดที่จัดท่าเสมอ</div></div>
<div class="principle"><div class="p-label">หลายรุ่นในเฟรมเดียว</div><div class="p-body">ช็อตที่ทรงพลังที่สุดมีหน้าคนแก่กับหน้าเด็กอยู่ด้วยกัน มองหามือ ไหล่ ตัก</div></div>
<div class="principle"><div class="p-label">หามุมที่เงียบ</div><div class="p-body">คนสามสิบคนเสียงดัง ถ่ายจากท้ายกลุ่ม ปลายแถว อีกฝั่งของชายหาด</div></div>
<div class="principle"><div class="p-label">ใช้ชีวิตในตอนจบ</div><div class="p-body">ห้านาทีแรกที่ชิราฮามะ โชว์กลางคืนดิสนีย์ รถบัสที่ออกตัวจากไป — อยู่ตรงนั้น หนังมีพอแล้ว</div></div></div>`;

SEC.en.arc=`<h2>🎞 Story Arc — 3 Acts</h2>
<p style="font-size:13px;color:var(--gray-700);margin-bottom:14px;">Not "7 days in Japan." A film with a spine — a family too big for one room arrives scattered, ends up in one frame on a white-sand beach, then scatters into the city and comes home together.</p>
<div class="arc-hook" style="background:linear-gradient(135deg,#78350f,#b45309)"><div class="hook-label">Prologue · the tradition</div><div class="hook-title">Photos and clips from the family trips before this one</div><div class="hook-desc">15–20 seconds of the past trips — the old group photos, the kids when they were smaller — with grandma’s voice over them (recorded on D2). This film is one chapter in a series, not a one-off.</div></div>
<div class="arc-hook"><div class="hook-label">Cold Open</div><div class="hook-title">Shirahama — surf breaking under the torii on its rock, white sand, a line of tiny figures along the water</div><div class="hook-desc">Cut to: a school bag dropped by the door, then Suvarnabhumi at night — one household, a short line of suitcases. Everyone else is already in Japan. "Two days earlier…" The contrast tells the story before a single word.</div></div>
<div class="acts-grid">
<div class="act-card act-1"><div class="act-num">Act I</div><div class="act-name">The Gathering</div><div class="act-days">D0 · D1</div><div class="act-feel">Scattered across different flights, tired — then one coach, red leaves and a ryokan.</div><div class="act-beat">Different flights, one coach.</div></div>
<div class="act-card act-2"><div class="act-num">Act II</div><div class="act-name">The Coast</div><div class="act-days">D2 · D3</div><div class="act-feel">White sand, a torii on the rocks, spring water, Fuji from a bridge.</div><div class="act-beat">Everyone in the same frame.</div></div>
<div class="act-card act-3"><div class="act-num">Act III</div><div class="act-name">The City & Home</div><div class="act-days">D4 · D5 · D6</div><div class="act-feel">Groups split up, lights, Disney, last walks — then one last headcount.</div><div class="act-beat">Everyone goes their own way — and comes back.</div></div></div>
${CURVE('Emotional tension curve','peak · Shirahama',['Act I · Gathering','Act II · The Coast','Act III · City & Home'])}
<div class="tip-box"><strong>Recurring motifs — shoot every time you see them</strong>🧮 <b>The headcount</b> — someone counting heads at every stop. Opens and closes the film: a short count on D0, the first full count at the coach on D1, the final count in the hotel lobby on D6, just before the coach leaves.<br>🧳 <b>The suitcases</b> — your household’s short line on D0, the whole family’s 30+ in the lobby on D6.<br>🚌 <b>The bus</b> — Insta360 always running; it is the family's home for three days.<br>🤲 <b>Hands across generations</b> — grandma's hand, a child's hand.<br>🖼 <b>The same group photo</b> — arranged like the last trip's, to sit side by side.<br>👨‍👩‍👧 <b>Household portraits</b> — one per family, same spot; the end credits.<br>📏 <b>Kids, two years on</b> — one straight portrait each, repeated every trip.</div>
<div class="tip-box" style="background:#fffbeb;border-color:#fcd34d;color:#92400e"><strong>Closing frame</strong>Thursday, early afternoon: the coach to Narita pulls away from the Ginza hotel, grandma and the kids waving from the windows, you on the pavement. The film ends before the coach turns the corner. Then the credits: household portraits, the group photos from every trip side by side, and one last card — “Until the next one.”</div>`;
SEC.th.arc=`<h2>🎞 โครงเรื่อง — 3 องก์</h2>
<p style="font-size:13px;color:var(--gray-700);margin-bottom:14px;">ไม่ใช่ "7 วันในญี่ปุ่น" แต่เป็นหนังที่มีแกน — ครอบครัวที่ใหญ่เกินห้องเดียว มาถึงแบบกระจัดกระจาย ได้อยู่ในเฟรมเดียวกันบนหาดทรายขาว แล้วแยกย้ายในเมือง ก่อนกลับบ้านพร้อมกัน</p>

function art(di,si){
 const [,sheetIndex,cellIndex]=THUMB_CELLS[di][si].split(':').map(Number);
 const sheet=LANDSCAPE_SHEETS[sheetIndex],cell=cellIndex;
 const [cols,rows]=sheet.grid,[w,h]=sheet.size;
 const col=cell%cols,row=Math.floor(cell/cols);
 const left=col/cols,right=(col+1)/cols;
 const top=sheet.rowEdges?sheet.rowEdges[row]:row/rows;
 const bottom=sheet.rowEdges?sheet.rowEdges[row+1]:(row+1)/rows;
 const panelW=right-left,panelH=bottom-top;
 // Keep each complete landscape panel visible without stretching the artwork.
 const ratio=(w*panelW)/(h*panelH),viewportRatio=16/9;
 const width=Math.min(1,ratio/viewportRatio)*100,height=Math.min(1,viewportRatio/ratio)*100;
 const x=panelW===1?0:left*100/(1-panelW),y=panelH===1?0:top*100/(1-panelH);
 return `<span class="shot-art" aria-hidden="true"><span class="shot-panel" style="width:${width}%;height:${height}%;background-image:url('assets/storyboard/${sheet.file}');background-size:${100/panelW}% ${100/panelH}%;background-position:${x}% ${y}%"></span></span>`;
}
function frame(comp,type,gear,tc,di,si){
 const off=type==='nocam'||type==='present';
 const ov=off?`<div class="vf-status ${type==='present'?'status-live':'status-off'}">${type==='present'?'🌿 LIVE':'🚫 OFF'}</div>`
  :`<div class="vf-gear">${gear[0]?gearLabel(gear[0]):TYPE[type].f}</div>`;
 return `<button type="button" class="shot-frame" onclick="previewShot(${di},${si})" aria-label="${lang==='th'?'ขยายภาพอ้างอิง':'Enlarge shot reference'}">${art(di,si)}<div class="viewfinder-overlay">${ov}</div></button>`;
}
function previewShot(di,si){
 let dialog=document.getElementById('shot-preview');
 if(!dialog){dialog=document.createElement('dialog');dialog.id='shot-preview';dialog.className='preview-dialog';document.body.appendChild(dialog);dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close();});}
 dialog.innerHTML=`<button class="preview-close" onclick="this.closest('dialog').close()">${lang==='th'?'ปิด':'Close'} ×</button><p>${lang==='th'?'ภาพร่างสตอรีบอร์ดแนวนอน 16:9 · สร้างด้วย AI':'Landscape 16:9 storyboard sketch · AI-generated'}</p><div class="preview-image">${art(di,si)}</div><p class="preview-caption"></p>`;
 dialog.querySelector('.preview-caption').textContent=DAYS[di].s[si][lang==='th'?4:2];
 dialog.showModal();
}

function renderHeroes(){
 document.getElementById('hero-card').innerHTML=`<h2>${STR[lang]['heroes.title']}</h2><p style="font-size:13px;color:var(--gray-700);margin-bottom:18px;">${STR[lang]['heroes.intro']}</p>`+
 HEROES.map(h=>{const x=h[lang];return `<div class="hero-shot"><div class="hero-num">Hero ${h.n}</div><div class="hero-title">${x.t}</div><div class="hero-desc" style="font-size:12px;color:var(--blue);font-weight:600">${x.s}</div><div class="hero-desc">${x.d}</div><div class="shot-gear" style="margin-bottom:8px">${h.gear.map(g=>`<span class="gear-badge ${g[0]}">${g[1]}</span>`).join('')}</div><div class="hero-why">${x.w}</div></div>`}).join('');
}

function renderDays(){
 const open=[...document.querySelectorAll('.day-block-header')].map(h=>h.classList.contains('open'));
 let sec=0;const pad=n=>String(n).padStart(2,'0');
 document.getElementById('day-list').innerHTML=DAYS.map((d,di)=>{const x=d[lang];
  const rows=d.s.map(([type,comp,et,en,tt,tn,gear,hn],si)=>{sec+=8;const tc=`00:${pad(Math.floor(sec/60))}:${pad(sec%60)}:00`;
   const framing=VERTICAL_NOTES[`${di}:${si}`]?.[lang];
   const title=lang==='th'?tt:et,note=lang==='th'?tn:en,label=type==='hero'?`${TYPE.hero[lang]} ${hn}`:TYPE[type][lang];
   return `<div class="shot-row ${ROWCLS[type]||''}" data-type="${type}">${frame(comp,type,gear,tc,di,si)}<div class="shot-body"><div class="shot-type ${TYPE[type].c}">${label}</div><div class="shot-title">${title}</div><div class="shot-note">${note}</div>${framing?`<div class="vertical-note"><strong>16:9</strong> · ${framing}</div>`:''}${gear.length?`<div class="shot-gear">${gear.map(g=>`<span class="gear-badge ${g[0]}">${g[1]}</span>`).join('')}</div>`:''}</div></div>`}).join('');
  const strip=d.s.map(([type,comp,et,,tt],i)=>`<div class="filmstrip-cell" title="${(lang==='th'?tt:et).replace(/"/g,'&quot;')}" onclick="jumpShot(${di},${i})">${art(di,i)}<span class="fc-label">${TYPE[type].f}</span></div>`).join('');
  const o=open[di]??(di===0);
  return `<div class="day-block"><div class="day-block-header${o?' open':''}" style="background:linear-gradient(135deg,${d.c});" onclick="toggleDay(this)"><div><div class="day-label">${x.l}</div><div class="day-name">${x.n}</div></div><div class="day-date">${x.d}</div><div class="chevron">▶</div></div>
  <div class="day-block-body${o?' open':''}"><div class="mindset-note"><strong>${STR[lang].mindset} · D${di}</strong>${x.m}</div><div class="vertical-guide">${VERTICAL_GUIDES[di][lang]}</div><p class="reference-note">${lang==='th'?'ภาพร่างแนวนอน 16:9 สร้างด้วย AI เพื่ออ้างอิงการจัดเฟรม · แตะภาพเพื่อขยาย':'Landscape 16:9 sketches · AI-generated framing references · Tap a shot to enlarge'}</p><div class="day-filmstrip">${strip}</div><div class="shot-list">${rows}</div></div></div>`}).join('');
}

function jumpShot(di,i){const b=document.querySelectorAll('.day-block-body')[di];if(!b.classList.contains('open'))toggleDay(b.previousElementSibling);
 const r=b.querySelectorAll('.shot-row')[i];setTimeout(()=>{r.scrollIntoView({behavior:'smooth',block:'center'});r.style.outline='2px solid var(--teal)';r.style.outlineOffset='2px';setTimeout(()=>{r.style.outline='';r.style.outlineOffset='';},1600);},350);}
function toggleDay(h){h.classList.toggle('open');h.nextElementSibling.classList.toggle('open');}
function navScroll(id,btn){document.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'start'});document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');}

function setLang(l){
 lang=l;try{localStorage.setItem('izu_lang',l);}catch(e){}
 document.documentElement.lang=l;
 document.getElementById('lang-toggle').textContent=l==='en'?'ภาษาไทย':'English';
 document.querySelectorAll('[data-k]').forEach(el=>{const v=STR[l][el.dataset.k];if(v!==undefined)el.textContent=v;});
 document.querySelectorAll('[data-sec]').forEach(el=>{el.innerHTML=SEC[l][el.dataset.sec]||'';});
 renderHeroes();renderDays();
}
function toggleLang(){setLang(lang==='en'?'th':'en');}
let saved=null;try{saved=localStorage.getItem('izu_lang');}catch(e){}
setLang(saved||'th');

</script>
</body>
